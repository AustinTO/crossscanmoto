name: Apple build verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_signed:
        description: Create a signed App Store Connect IPA (requires signing secrets)
        type: boolean
        default: false
      upload_to_testflight:
        description: Upload the signed IPA to App Store Connect TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify Apple SDK version
        run: |
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Using iOS SDK $SDK_VERSION"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "::error::Apple requires iOS SDK 26 or later; this runner selected $SDK_VERSION."
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Record Apple SDK and Flutter toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --exclude-tags screenshots
      - name: Build iOS simulator
        run: flutter build ios --simulator --debug
      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-builds
          path: build/ios
          if-no-files-found: error

  signed:
    if: github.event_name == 'workflow_dispatch' && inputs.build_signed
    needs: [ios, payment-backend]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PAYMENT_API_URL: ${{ vars.PAYMENT_API_URL }}
      APPLE_UNLOCK_PRODUCT_ID: ${{ vars.APPLE_UNLOCK_PRODUCT_ID }}
      GOOGLE_UNLOCK_PRODUCT_ID: ${{ vars.GOOGLE_UNLOCK_PRODUCT_ID }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
      UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify Apple SDK version
        run: |
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Using iOS SDK $SDK_VERSION"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "::error::Apple requires iOS SDK 26 or later; this runner selected $SDK_VERSION."
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Record Apple SDK and Flutter toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          flutter --version
      - run: flutter pub get
      - name: Archive, export, and optionally upload
        shell: bash
        run: |
          set -euo pipefail
          set +x

          : "${APPLE_BUNDLE_ID:?Set the APPLE_BUNDLE_ID repository variable to the registered app ID}"
          : "${APPLE_TEAM_ID:?Set the APPLE_TEAM_ID secret}"
          : "${PAYMENT_API_URL:?Set PAYMENT_API_URL to the production payment API base URL}"
          : "${APPLE_UNLOCK_PRODUCT_ID:?Set APPLE_UNLOCK_PRODUCT_ID to the App Store Connect product ID}"
          : "${APPLE_CERTIFICATE_BASE64:?Set APPLE_CERTIFICATE_BASE64 to a base64 encoded Apple Distribution .p12}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Set APPLE_CERTIFICATE_PASSWORD}"
          : "${APPLE_PROVISIONING_PROFILE_BASE64:?Set APPLE_PROVISIONING_PROFILE_BASE64 to an App Store profile for this app}"
          if [[ "$UPLOAD_TO_TESTFLIGHT" == "true" ]]; then
            : "${ASC_API_KEY_ID:?Set ASC_API_KEY_ID for the explicitly requested TestFlight upload}"
            : "${ASC_API_ISSUER_ID:?Set ASC_API_ISSUER_ID for the explicitly requested TestFlight upload}"
            : "${ASC_API_PRIVATE_KEY:?Set ASC_API_PRIVATE_KEY for the explicitly requested TestFlight upload}"
          fi
          python3 - "$PAYMENT_API_URL" <<'PY'
          import sys
          from urllib.parse import urlparse

          url = urlparse(sys.argv[1])
          if (url.scheme != "https" or not url.hostname or url.username or url.password
                  or url.path not in ("", "/") or url.query or url.fragment):
              raise SystemExit("PAYMENT_API_URL must be an HTTPS origin without credentials, path, query, or fragment")
          PY

          temp_dir="$(mktemp -d)"
          keychain_path="$temp_dir/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          profile_path="$temp_dir/profile.mobileprovision"
          cert_path="$temp_dir/distribution.p12"
          profile_plist="$temp_dir/profile.plist"
          installed_profile_path=""
          api_key_path=""
          signing_xcconfig="$temp_dir/signing.xcconfig"
          export_options="$temp_dir/ExportOptions.plist"
          cleanup() {
            if [[ -n "$installed_profile_path" ]]; then
              rm -f "$installed_profile_path"
            fi
            if [[ -n "$api_key_path" ]]; then
              rm -f "$api_key_path"
            fi
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -rf "$temp_dir"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$cert_path"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          app_id_prefix="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationIdentifierPrefix:0' "$profile_plist")"
          profile_get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist")"
          [[ "$profile_team" == "$APPLE_TEAM_ID" ]]
          [[ "$profile_app_id" == "$app_id_prefix.$APPLE_BUNDLE_ID" ]]
          [[ "$profile_get_task_allow" == "false" ]]
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1; then
            echo 'The provisioning profile is not an App Store distribution profile.' >&2
            exit 1
          fi
          installed_profile_path="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          cp "$profile_path" "$installed_profile_path"

          cat > "$signing_xcconfig" <<EOF
          DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}
          PRODUCT_BUNDLE_IDENTIFIER = ${APPLE_BUNDLE_ID}
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = ${profile_uuid}
          EOF

          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>${APPLE_BUNDLE_ID}</key><string>${profile_uuid}</string>
            </dict>
          </dict></plist>
          EOF

          export XCODE_XCCONFIG_FILE="$signing_xcconfig"
          build_args=(
            ipa --release --no-pub
            --export-options-plist "$export_options"
            --build-number "${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            --dart-define="PAYMENT_API_URL=${PAYMENT_API_URL}"
            --dart-define="APPLE_UNLOCK_PRODUCT_ID=${APPLE_UNLOCK_PRODUCT_ID}"
          )
          if [[ -n "$GOOGLE_UNLOCK_PRODUCT_ID" ]]; then
            build_args+=("--dart-define=GOOGLE_UNLOCK_PRODUCT_ID=${GOOGLE_UNLOCK_PRODUCT_ID}")
          fi
          flutter build "${build_args[@]}"
          ipa_path="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path" && test -f "$ipa_path"
          mkdir -p build/signed
          cp "$ipa_path" build/signed/app.ipa

          if [[ "$UPLOAD_TO_TESTFLIGHT" == "true" ]]; then
            api_key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
            mkdir -p "$(dirname "$api_key_path")"
            printf '%s' "$ASC_API_PRIVATE_KEY" > "$api_key_path"
            xcrun altool --upload-app --type ios --file build/signed/app.ipa --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: build/signed/app.ipa
          if-no-files-found: error

  payment-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check all database migrations
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          connection = sqlite3.connect(':memory:')
          for path in sorted(Path('migrations').glob('*.sql')):
              connection.executescript(path.read_text())
              print('Applied', path.name)
          PY
      - run: pnpm exec wrangler deploy --dry-run
