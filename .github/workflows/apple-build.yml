name: Apple build verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_signed:
        description: Create a signed App Store Connect IPA (requires signing secrets)
        type: boolean
        default: false
      upload_to_testflight:
        description: Upload the signed IPA to App Store Connect TestFlight
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check all database migrations
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          connection = sqlite3.connect(':memory:')
          for path in sorted(Path('migrations').glob('*.sql')):
              connection.executescript(path.read_text())
              print('Applied', path.name)
          PY
      - run: pnpm exec wrangler deploy --dry-run

  ios:
    name: Build, test, and release iOS
    needs: [payment-backend]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PAYMENT_API_URL: ${{ vars.PAYMENT_API_URL }}
      APPLE_UNLOCK_PRODUCT_ID: ${{ vars.APPLE_UNLOCK_PRODUCT_ID }}
      GOOGLE_UNLOCK_PRODUCT_ID: ${{ vars.GOOGLE_UNLOCK_PRODUCT_ID }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
      BUILD_SIGNED: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_signed) || (github.event_name == 'push' && github.ref == 'refs/heads/release-hardening/production-audit') }}
      UPLOAD_TO_TESTFLIGHT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/release-hardening/production-audit') || (inputs.upload_to_testflight != false) }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify Apple SDK version
        run: |
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Using iOS SDK $SDK_VERSION"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "::error::Apple requires iOS SDK 26 or later; this runner selected $SDK_VERSION."
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Record Apple SDK and Flutter toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --exclude-tags screenshots
      - name: Build iOS simulator (PR / non-release only)
        if: env.BUILD_SIGNED != 'true'
        run: flutter build ios --simulator --debug
      - name: Build signed iOS archive and upload to TestFlight
        if: env.BUILD_SIGNED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +x

          : "${APPLE_BUNDLE_ID:?Set the APPLE_BUNDLE_ID repository variable to the registered app ID}"
          : "${APPLE_TEAM_ID:?Set the APPLE_TEAM_ID secret}"
          : "${PAYMENT_API_URL:?Set PAYMENT_API_URL to the production payment API base URL}"
          : "${APPLE_UNLOCK_PRODUCT_ID:?Set APPLE_UNLOCK_PRODUCT_ID to the App Store Connect product ID}"
          : "${APPLE_CERTIFICATE_BASE64:?Set APPLE_CERTIFICATE_BASE64 to a base64 encoded Apple Distribution .p12}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Set APPLE_CERTIFICATE_PASSWORD}"
          : "${APPLE_PROVISIONING_PROFILE_BASE64:?Set APPLE_PROVISIONING_PROFILE_BASE64 to an App Store profile for this app}"
          if [[ "$UPLOAD_TO_TESTFLIGHT" == "true" ]]; then
            : "${ASC_API_KEY_ID:?Set ASC_API_KEY_ID for the TestFlight upload}"
            : "${ASC_API_ISSUER_ID:?Set ASC_API_ISSUER_ID for the TestFlight upload}"
            : "${ASC_API_PRIVATE_KEY:?Set ASC_API_PRIVATE_KEY for the TestFlight upload}"
          fi

          python3 -c '
          import sys, os
          from urllib.parse import urlparse
          val = os.environ.get("PAYMENT_API_URL", "")
          url = urlparse(val)
          if url.scheme != "https" or not url.hostname or url.username or url.password or url.path not in ("", "/") or url.query or url.fragment:
              raise SystemExit(f"PAYMENT_API_URL must be an HTTPS origin: {val}")
          '

          temp_dir="$(mktemp -d)"
          keychain_path="$temp_dir/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          profile_path="$temp_dir/profile.mobileprovision"
          cert_path="$temp_dir/distribution.p12"
          profile_plist="$temp_dir/profile.plist"
          installed_profile_path=""
          api_key_path=""
          export_options="$temp_dir/ExportOptions.plist"

          cleanup() {
            if [[ -n "$installed_profile_path" ]]; then
              rm -f "$installed_profile_path"
            fi
            if [[ -n "$api_key_path" ]]; then
              rm -f "$api_key_path"
            fi
            git checkout ios/Flutter/Release.xcconfig >/dev/null 2>&1 || true
            security default-keychain -s login.keychain >/dev/null 2>&1 || true
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -rf "$temp_dir"
          }
          trap cleanup EXIT

          python3 -c 'import sys, base64, os; open(sys.argv[1], "wb").write(base64.b64decode(os.environ[sys.argv[2]]))' "$cert_path" "APPLE_CERTIFICATE_BASE64"
          python3 -c 'import sys, base64, os; open(sys.argv[1], "wb").write(base64.b64decode(os.environ[sys.argv[2]]))' "$profile_path" "APPLE_PROVISIONING_PROFILE_BASE64"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')

          echo "=== Active signing identities in keychain ==="
          security find-identity -v -p codesigning "$keychain_path"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(python3 -c '
          import sys, plistlib

          plist_path, expected_team, expected_bundle = sys.argv[1:4]
          with open(plist_path, "rb") as f:
              pl = plistlib.load(f)

          uuid = pl.get("UUID")
          team = pl.get("TeamIdentifier", [""])[0]
          app_id = pl.get("Entitlements", {}).get("application-identifier", "")
          prefix = pl.get("ApplicationIdentifierPrefix", [""])[0]
          task_allow = pl.get("Entitlements", {}).get("get-task-allow", False)
          provisioned_devices = "ProvisionedDevices" in pl

          if team != expected_team:
              raise SystemExit(f"Team mismatch: {team} != {expected_team}")
          if app_id != f"{prefix}.{expected_bundle}":
              raise SystemExit(f"App ID mismatch: {app_id} != {prefix}.{expected_bundle}")
          if task_allow:
              raise SystemExit("get-task-allow must be false for App Store profile")
          if provisioned_devices:
              raise SystemExit("ProvisionedDevices present: not an App Store distribution profile")

          print(uuid)
          ' "$profile_plist" "$APPLE_TEAM_ID" "$APPLE_BUNDLE_ID")"
          installed_profile_path="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          cp "$profile_path" "$installed_profile_path"
          echo "Installed provisioning profile: $profile_uuid"

          printf '\nDEVELOPMENT_TEAM = %s\nPRODUCT_BUNDLE_IDENTIFIER = %s\nCODE_SIGN_STYLE = Manual\nCODE_SIGN_IDENTITY = Apple Distribution\nCODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution\nPROVISIONING_PROFILE_SPECIFIER = %s\n' \
            "$APPLE_TEAM_ID" "$APPLE_BUNDLE_ID" "$profile_uuid" >> ios/Flutter/Release.xcconfig

          python3 -c '
          import sys, plistlib
          out_path, team_id, bundle_id, profile_uuid = sys.argv[1:5]
          opts = {
              "destination": "export",
              "method": "app-store",
              "signingStyle": "manual",
              "teamID": team_id,
              "provisioningProfiles": {bundle_id: profile_uuid},
              "signingCertificate": "Apple Distribution",
          }
          with open(out_path, "wb") as f:
              plistlib.dump(opts, f)
          ' "$export_options" "$APPLE_TEAM_ID" "$APPLE_BUNDLE_ID" "$profile_uuid"

          build_args=(
            ipa --release --no-pub
            --export-options-plist "$export_options"
            --build-number "${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            --dart-define="PAYMENT_API_URL=${PAYMENT_API_URL}"
            --dart-define="APPLE_UNLOCK_PRODUCT_ID=${APPLE_UNLOCK_PRODUCT_ID}"
          )
          if [[ -n "$GOOGLE_UNLOCK_PRODUCT_ID" ]]; then
            build_args+=("--dart-define=GOOGLE_UNLOCK_PRODUCT_ID=${GOOGLE_UNLOCK_PRODUCT_ID}")
          fi

          echo "Running flutter build ipa..."
          if ! flutter build "${build_args[@]}"; then
            echo "::error::flutter build ipa failed! Diagnostic logs:"
            find ~/Library/Logs -type f -name "*.log" -exec head -n 100 {} + 2>/dev/null || true
            exit 1
          fi

          ipa_path="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path" && test -f "$ipa_path"
          mkdir -p build/signed
          cp "$ipa_path" build/signed/app.ipa
          echo "Signed IPA ready at build/signed/app.ipa"

          if [[ "$UPLOAD_TO_TESTFLIGHT" == "true" ]]; then
            echo "Uploading signed IPA to TestFlight..."
            api_key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
            mkdir -p "$(dirname "$api_key_path")" "$HOME/.private_keys"
            printf '%s' "$ASC_API_PRIVATE_KEY" > "$api_key_path"
            cp "$api_key_path" "$HOME/.private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
            xcrun altool --upload-app --type ios --file build/signed/app.ipa --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
            echo "Upload to TestFlight succeeded."
          fi
      - uses: actions/upload-artifact@v4
        if: env.BUILD_SIGNED == 'true'
        with:
          name: ios-signed-ipa
          path: build/signed/app.ipa
          if-no-files-found: error
